name: Release macOS TUI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build-release.sh
      - name: Prepare installer
        run: sed "s|__GITHUB_REPOSITORY__|$GITHUB_REPOSITORY|g" scripts/install.sh > apps/tui/dist/release/install.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          apps/tui/dist/release/stm-darwin-arm64.tar.gz
          apps/tui/dist/release/stm-darwin-x64.tar.gz
          apps/tui/dist/release/checksums.txt
          apps/tui/dist/release/install.sh
          --generate-notes
          --title "$GITHUB_REF_NAME"
